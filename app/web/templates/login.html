<!doctype html>
<html lang="ko" class="login-page">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · PublicDB2</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/login.css') }}">
</head>
<body class="login-body"><main class="login-main"><section class="panel login-card">
  <header class="login-heading"><span class="login-brand">Public<span>DB2</span></span><h1>로그인</h1>
  <p>공공기관 정보 수집·관리 시스템</p></header>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="login-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="login-field"><span>아이디</span><input class="login-control" name="username" required autocomplete="username"></label>
    <label class="login-field"><span>비밀번호</span><input class="login-control" name="password" type="password" required autocomplete="current-password"></label>
    <button class="button button--primary" type="submit">로그인</button>
  </form>
</section></main></body></html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · PublicDB2</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/workspace.css') }}">
</head>
<body><main class="page-content"><section class="panel settings-card login-card">
  <span class="brand-name">Public<span>DB2</span></span><h1>로그인</h1>
  <p>공공기관 정보 수집·관리 시스템</p>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="settings-fields">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="settings-field"><span class="field-label">아이디</span><input class="control" name="username" required autocomplete="username"></label>
    <label class="settings-field"><span class="field-label">비밀번호</span><input class="control" name="password" type="password" required autocomplete="current-password"></label>
    <button class="button button--primary" type="submit">로그인</button>
  </form>
</section></main></body></html>
